spring.datasource.url=jdbc:h2:mem:borrowbuddy-test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.h2.console.enabled=false
app.jwt.secret=test-only-borrowbuddy-jwt-secret-0123456789abcdefghijklmnop
app.jwt.expiration-ms=3600000
app.seed.enabled=false
app.mail.enabled=false
app.upload.dir=./target/test-uploads
app.upload.import-demo-images=false
app.rate-limit.enabled=false
app.auth.allowed-email-domains=college.edu
app.cors.allowed-origins=http://localhost:8080
app.reminders.cron=0 0 0 1 1 *
