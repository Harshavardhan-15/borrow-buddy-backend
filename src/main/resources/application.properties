# ------------------------------------------------------------------
# BorrowBuddy - shared configuration
# Active profile defaults to "dev" (MySQL + seeded demo data).
# Automated tests use the "test" profile (in-memory H2).
# Production: SPRING_PROFILES_ACTIVE=prod
# ------------------------------------------------------------------
spring.application.name=BorrowBuddy
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

server.port=${PORT:8080}
server.forward-headers-strategy=framework
server.error.include-message=never
server.error.include-stacktrace=never

spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=false

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
spring.mvc.problemdetails.enabled=false

# JWT
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Uploads (local storage for development; see docs/DEPLOYMENT.md for cloud storage)
app.upload.dir=${UPLOAD_DIR:./uploads}
app.upload.max-bytes=${UPLOAD_MAX_BYTES:5242880}

# Security / CORS
app.cors.allowed-origins=${FRONTEND_URL:http://localhost:8080}
app.auth.allowed-email-domains=${ALLOWED_EMAIL_DOMAINS:college.edu}

# Email notifications (optional)
app.mail.enabled=${MAIL_ENABLED:false}
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Scheduled return reminders (daily at 08:00 server time by default)
app.reminders.cron=${REMINDER_CRON:0 0 8 * * *}

# Demo data seeding (enabled only in dev profile)
app.seed.enabled=${SEED_ENABLED:false}

# Logging
logging.level.com.borrowbuddy=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
