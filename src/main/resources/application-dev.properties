# ------------------------------------------------------------------
# Local development profile - MySQL (the database used by MySQL Workbench)
#
# Local instance created for this project:
#   Host: 127.0.0.1   Port: 3306   Database: borrowbuddy_db
#   App user: borrowbuddy / BorrowBuddy_dev_2026!
#   Root user: root / BorrowBuddy_root_2026!
# These are DEV-ONLY credentials. Production values come from env vars.
#
# Automated tests use H2 (application-test.properties) so CI needs no DB.
# ------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/borrowbuddy_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:borrowbuddy}
spring.datasource.password=${DB_PASSWORD:BorrowBuddy_dev_2026!}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.h2.console.enabled=false

# DEV-ONLY secret. Production requires the JWT_SECRET environment variable.
app.jwt.secret=dev-only-borrowbuddy-jwt-secret-change-me-0123456789abcdef
app.seed.enabled=true

app.cors.allowed-origins=http://localhost:8080,http://127.0.0.1:8080,http://localhost:3000,http://localhost:5500
