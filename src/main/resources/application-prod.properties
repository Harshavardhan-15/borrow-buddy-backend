# ------------------------------------------------------------------
# Production profile
# All secrets come from environment variables. Startup fails fast if
# JWT_SECRET / DB credentials are missing.
# ------------------------------------------------------------------
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:update}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.h2.console.enabled=false

app.jwt.secret=${JWT_SECRET}
app.seed.enabled=false
app.mail.enabled=${MAIL_ENABLED:false}
app.cors.allowed-origins=${FRONTEND_URL}

server.error.include-message=never
logging.level.com.borrowbuddy=INFO
